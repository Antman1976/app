<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vertical Jump Pro</title>
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A polished 24-week vertical jump training PWA with daily programming, jump timing, weekly tracking, and calculated training loads." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-bg"></div>
  <div class="app-shell">
    <header class="app-header glass">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true"><img src="icons/logo.svg" class="brand-logo" alt="" /></div>
        <div>
          <p class="eyebrow">Performance PWA</p>
          <h1>Vertical Jump Pro</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="installBtn" class="btn btn-secondary hidden">Install</button>
        <button id="resetTodayBtn" class="btn btn-ghost">Reset Today</button>
      </div>
    </header>

    <section class="hero-panel glass">
      <div class="hero-copy">
        <p class="eyebrow">Today’s focus</p>
        <h2 id="heroTitle">Week 1 • Monday</h2>
        <p id="heroSubtitle" class="hero-subtitle">Build force, move clean, and keep the session crisp.</p>
      </div>
      <div class="hero-quick-controls">
        <label class="field-inline">
          <span>Week</span>
          <select id="headerWeekSelect"></select>
        </label>
        <label class="field-inline">
          <span>Day</span>
          <select id="headerDaySelect"></select>
        </label>
      </div>
    </section>

    <main class="view-stack">
      <section id="view-home" class="view active" aria-label="Home"></section>
      <section id="view-program" class="view" aria-label="Program"></section>
      <section id="view-today" class="view" aria-label="Today"></section>
      <section id="view-tracker" class="view" aria-label="Tracker"></section>
      <section id="view-settings" class="view" aria-label="Settings"></section>
    </main>

    <nav class="bottom-nav glass" aria-label="Primary navigation">
      <button class="nav-btn active" data-view="home">
        <span class="nav-ico">⌂</span>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-view="program">
        <span class="nav-ico">▤</span>
        <span>Program</span>
      </button>
      <button class="nav-btn" data-view="today">
        <span class="nav-ico">✓</span>
        <span>Today</span>
      </button>
      <button class="nav-btn" data-view="tracker">
        <span class="nav-ico">◔</span>
        <span>Tracker</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <span class="nav-ico">⚙</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>


  <div id="exerciseModal" class="exercise-modal" aria-hidden="true">
    <div class="exercise-modal-backdrop" data-close-exercise-modal></div>
    <div class="exercise-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="exerciseModalTitle">
      <button class="exercise-modal-close" type="button" data-close-exercise-modal aria-label="Close">×</button>
      <div class="exercise-modal-media-wrap">
        <img id="exerciseModalImage" class="exercise-modal-image" alt="Exercise illustration" />
      </div>
      <div class="exercise-modal-content">
        <p class="eyebrow">Exercise details</p>
        <h3 id="exerciseModalTitle" class="exercise-modal-title">Exercise</h3>
        <p id="exerciseModalMeta" class="exercise-modal-meta"></p>
        <p id="exerciseModalDescription" class="exercise-modal-description"></p>
        <div class="exercise-modal-grid">
          <div class="detail-box">
            <h4>Why it is here</h4>
            <p id="exerciseModalWhy"></p>
          </div>
          <div class="detail-box">
            <h4>Coaching cues</h4>
            <ul id="exerciseModalCues"></ul>
          </div>
          <div class="detail-box">
            <h4>Avoid this</h4>
            <ul id="exerciseModalAvoid"></ul>
          </div>
          <div class="detail-box">
            <h4>Program note</h4>
            <p id="exerciseModalNote"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <input id="importFileInput" type="file" accept="application/json" hidden />

  <script src="app.js"></script>
</body>
</html>
